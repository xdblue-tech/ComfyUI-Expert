[project]
name = "distribute-agent"
version = "0.1.0"
description = "Prototype SmolAgents CodeAgent driving the standalone RunPod oneshot package"
requires-python = ">=3.12,<3.13"
dependencies = ["smolagents==1.26.0"]

[project.optional-dependencies]
# The live-eval CLI defaults to litellm; base smolagents does not install it.
litellm = ["smolagents[litellm]==1.26.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["distribute_agent"]
