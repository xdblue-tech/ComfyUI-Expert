# Models baked into images/video-wan.
#
# Keys are ComfyUI model directory names under comfyui_models_path (config/rp.yaml);
# values are filenames inside that directory. Kept in sync with the Dockerfile
# COPY lines — `python3 scripts/rp_images.py build --check` fails if the two drift.
#
# Prerequisites follow skills/comfyui-video-pipeline/SKILL.md (Wan 2.2 MoE / I2V),
# with the local filenames substituted where the skill names a variant we do not
# have: clip_vision_h.safetensors is the CLIP-ViT-H file used by Wan I2V here.

diffusion_models:
  - wan2.1_i2v_720p_14B_fp8_e4m3fn.safetensors
  - FramePackI2V_HY_fp8_e4m3fn.safetensors

text_encoders:
  - umt5_xxl_fp8_e4m3fn_scaled.safetensors

clip_vision:
  - clip_vision_h.safetensors

vae:
  - wan_2.1_vae.safetensors
