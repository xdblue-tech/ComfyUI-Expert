# Models baked into images/images-sdxl.
#
# Keys are ComfyUI model directory names under comfyui_models_path (config/rp.yaml);
# values are filenames inside that directory. Kept in sync with the Dockerfile
# COPY lines — `python3 scripts/rp_images.py build --check` fails if the two drift.

checkpoints:
  - unholyDesireMixSinister_v80.safetensors
loras:
  - cinematic photography detailed illu xl v5.safetensors

# Workflows this image is baked for. `build --check` verifies every model file
# their Loader nodes reference is present in the manifest above.
workflows:
  - workflows/unholy-sdxl.json
